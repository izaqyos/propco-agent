repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: no-secrets
        name: block obvious secrets
        entry: bash -c 'if git diff --cached -U0 | grep -E "^\+.*(sk-ant-|sk-[A-Za-z0-9]{20,}|ANTHROPIC_API_KEY=.+|OPENAI_API_KEY=.+)" ; then echo "possible secret in staged diff"; exit 1; fi'
        language: system
        pass_filenames: false
